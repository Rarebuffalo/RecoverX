[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# We use SYNC_DATABASE_URL or override in env.py using async engine
sqlalchemy.url = postgresql://recoverx:recoverx_secret@localhost:5432/recoverx_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
